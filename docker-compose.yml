services:
  screenshot-service:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    volumes:
      - ./screenshots:/app/screenshots
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    volumes:
      - ./test-reports:/app/test-reports
    environment:
      - PYTHONUNBUFFERED=1