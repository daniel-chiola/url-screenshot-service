<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>URL Screenshot Service</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.85rem; color: #444; }
    .field.grow { flex: 1; min-width: 200px; }
    .field-inline { display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; color: #444; }
    input[type="url"], input[type="number"] { padding: 0.5rem; font-size: 1rem; }
    input[type="number"] { width: 5.5rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; height: fit-content; }
    button:disabled { opacity: 0.6; cursor: default; }
    fieldset { border: none; padding: 0; margin: 0; display: flex; gap: 0.75rem; flex-wrap: wrap; }
    #status { margin-top: 1rem; color: #666; }
    #error { margin-top: 1rem; color: #b00020; }
    #result { margin-top: 1.5rem; }
    #result img { max-width: 100%; border: 1px solid #ccc; }
    h2 { margin-top: 2.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #eee; }
    .badge { padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.8rem; white-space: nowrap; }
    .badge-pending, .badge-processing { background: #fff3cd; color: #856404; }
    .badge-done { background: #d4edda; color: #155724; }
    .badge-error { background: #f8d7da; color: #721c24; }
    .retry-btn { margin-left: 0.5rem; padding: 0.15rem 0.5rem; font-size: 0.8rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .stat-card { background: #f7f7f7; border: 1px solid #eee; border-radius: 8px; padding: 0.75rem 1rem; }
    .stat-label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-value { font-size: 1.4rem; font-weight: 600; margin-top: 0.15rem; }
  </style>
</head>
<body>
  <h1>URL Screenshot Service</h1>
  <form id="screenshot-form">
    <div class="field grow">
      <label for="url-input">URL</label>
      <input type="url" id="url-input" placeholder="https://example.com" required>
    </div>
    <div class="field">
      <label for="width-input">Larghezza</label>
      <input type="number" id="width-input" value="1280" min="200" max="3840">
    </div>
    <div class="field">
      <label for="height-input">Altezza</label>
      <input type="number" id="height-input" value="800" min="200" max="3840">
    </div>
    <fieldset>
      <label class="field-inline"><input type="checkbox" id="full-page-input"> Pagina intera</label>
      <label class="field-inline"><input type="checkbox" id="dark-mode-input"> Dark mode</label>
      <label class="field-inline"><input type="checkbox" id="block-ads-input" checked> Blocca ads</label>
    </fieldset>
    <button type="submit" id="submit-btn">Cattura screenshot</button>
  </form>
  <div id="status"></div>
  <div id="error"></div>
  <div id="result"></div>

  <h2>Coda job</h2>
  <table>
    <thead>
      <tr><th>URL</th><th>Stato</th><th>Creato</th><th>Risultato</th></tr>
    </thead>
    <tbody id="jobs-body"></tbody>
  </table>

  <h2>Metriche</h2>
  <div class="stats-grid" id="metrics">
    <div class="stat-card">
      <div class="stat-label">Completati</div>
      <div class="stat-value" id="done-jobs">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">In errore</div>
      <div class="stat-value" id="error-jobs">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tempo medio di completamento</div>
      <div class="stat-value" id="avg-completion">-</div>
    </div>
  </div>

  <script>
    const form = document.getElementById("screenshot-form");
    const submitBtn = document.getElementById("submit-btn");
    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const result = document.getElementById("result");
    const jobsBody = document.getElementById("jobs-body");

    let pollTimer = null;

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }

    async function pollJob(jobId) {
      try {
        const response = await fetch(`/screenshot/${jobId}`);
        const data = await response.json();

        if (data.status === "done") {
          clearInterval(pollTimer);
          status.textContent = `Salvato come ${data.filename}`;
          result.innerHTML = `<img src="/screenshots/${encodeURIComponent(data.filename)}?t=${Date.now()}" alt="${escapeHtml(data.filename)}">`;
          submitBtn.disabled = false;
        } else if (data.status === "error") {
          clearInterval(pollTimer);
          status.textContent = "";
          error.textContent = data.error || "Errore durante la cattura";
          submitBtn.disabled = false;
        } else {
          status.textContent = `Stato: ${data.status}...`;
        }
      } catch (err) {
        clearInterval(pollTimer);
        error.textContent = err.message;
        submitBtn.disabled = false;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        url: document.getElementById("url-input").value,
        width: Number(document.getElementById("width-input").value) || 1280,
        height: Number(document.getElementById("height-input").value) || 800,
        full_page: document.getElementById("full-page-input").checked,
        dark_mode: document.getElementById("dark-mode-input").checked,
        block_ads: document.getElementById("block-ads-input").checked,
      };

      submitBtn.disabled = true;
      status.textContent = "Invio in corso...";
      error.textContent = "";
      result.innerHTML = "";
      if (pollTimer) clearInterval(pollTimer);

      try {
        const response = await fetch("/screenshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const detail = await response.json().catch(() => null);
          throw new Error(detail?.detail || `Errore ${response.status}`);
        }

        const data = await response.json();
        status.textContent = "In coda...";
        pollTimer = setInterval(() => pollJob(data.id), 1500);
      } catch (err) {
        status.textContent = "";
        error.textContent = err.message;
        submitBtn.disabled = false;
      }
    });

    function renderJobs(jobsList) {
      jobsBody.innerHTML = jobsList.map((job) => {
        const created = new Date(job.created_at).toLocaleTimeString();
        let resultCell = "-";
        if (job.status === "done" && job.filename) {
          resultCell = `<a href="/screenshots/${encodeURIComponent(job.filename)}" target="_blank">apri</a>`;
        } else if (job.status === "error") {
          const jobId = escapeHtml(job.id);
          resultCell = `${escapeHtml(job.error || "")} <button class="retry-btn" data-job-id="${jobId}">Riprova</button>`;
        }
        return `<tr>
          <td>${escapeHtml(job.url)}</td>
          <td><span class="badge badge-${job.status}">${escapeHtml(job.status)}</span></td>
          <td>${created}</td>
          <td>${resultCell}</td>
        </tr>`;
      }).join("");
    }

    jobsBody.addEventListener("click", async (e) => {
      if (!e.target.classList.contains("retry-btn")) return;
      const jobId = e.target.dataset.jobId;

      e.target.disabled = true;
      error.textContent = "";

      try {
        const response = await fetch(`/screenshot/${jobId}/retry`, { method: "POST" });
        if (!response.ok) {
          const detail = await response.json().catch(() => null);
          throw new Error(detail?.detail || `Errore ${response.status}`);
        }
        await refreshJobs();
      } catch (err) {
        error.textContent = err.message;
        e.target.disabled = false;
      }
    });

    async function refreshJobs() {
      try {
        const response = await fetch("/jobs");
        const data = await response.json();
        renderJobs(data);
      } catch (err) {
        // la coda è un extra informativo: un errore qui non deve bloccare il resto della UI
      }
    }

    refreshJobs();
    setInterval(refreshJobs, 2000);

    const metricsEls = {
      doneJobs: document.getElementById("done-jobs"),
      errorJobs: document.getElementById("error-jobs"),
      avgCompletion: document.getElementById("avg-completion"),
    };

    function formatSeconds(value) {
      return value === null || value === undefined ? "-" : `${value.toFixed(2)}s`;
    }

    async function refreshStats() {
      try {
        const response = await fetch("/stats");
        const data = await response.json();
        metricsEls.doneJobs.textContent = data.done_jobs;
        metricsEls.errorJobs.textContent = data.error_jobs;
        metricsEls.avgCompletion.textContent = formatSeconds(data.avg_completion_seconds);
      } catch (err) {
        // le metriche sono un extra informativo: un errore qui non deve bloccare il resto della UI
      }
    }

    // Nessun polling automatico qui: le metriche si aggiornano solo al caricamento
    // della pagina, per non moltiplicare le richieste oltre al polling già attivo su /jobs.
    refreshStats();
  </script>
</body>
</html>
