[project]
name = "url-screenshot-service"
version = "0.1.0"
description = "Dockerized service that captures web page screenshots from URLs."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "playwright==1.47.0",
    "pydantic==2.9.2",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "slowapi>=0.1.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
]

[tool.pytest.ini_options]
# Aggiunge la cartella del progetto a sys.path, così i test possono fare
# "from app import ..." indipendentemente da dove/come viene lanciato pytest.
pythonpath = ["."]
